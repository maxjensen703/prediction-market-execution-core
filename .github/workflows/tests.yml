name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies into a fresh venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Run the suite (offline, HTTP mocked, no credentials)
        run: .venv/bin/python -m pytest -q
